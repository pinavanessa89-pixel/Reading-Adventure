<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reading Adventure</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Trebuchet MS",sans-serif;background:linear-gradient(#eaf9ff,#fff6e8);color:#293241}header{text-align:center;padding:18px;background:#fff}h1{margin:0;color:#7054b5}.wrap{max-width:850px;margin:auto;padding:16px 16px 100px}.card{background:#fff;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 5px 15px #0001}.hero{text-align:center;background:linear-gradient(135deg,#eee8ff,#e5f8ff)}h2{color:#684aa9}.stars{font-size:34px}.mission{padding:18px;border-radius:20px;margin:14px 0}.pink{background:#ffe9f2}.blue{background:#e5f6ff}.green{background:#e8f8ef}.orange{background:#fff0df}.prompt{font-size:22px;text-align:center;background:#fff;border-radius:16px;padding:15px;margin:10px 0}.word{font-size:52px;font-weight:900;text-align:center;color:#3f5a90}.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:14px 18px;background:#7357b6;color:#fff;min-height:56px}.done{background:#4da77b}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{font-size:34px;background:#fff;color:#3f5a90;border:3px solid #cfe6f3;border-radius:16px;min-height:72px}.correct{background:#dff7e8}.wrong{background:#ffe4e4}.trace{background:#fff;border:3px dashed #c9b9ed;border-radius:18px;padding:8px}canvas{width:100%;height:250px;display:block;touch-action:none}.hide{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:9px;display:flex;justify-content:center;gap:8px;border-top:1px solid #ddd}nav .btn{background:#eeeaf8;color:#5c5074}.next{text-align:center;background:#fff6c7;padding:18px;border-radius:18px}</style></head><body><header><h1>🌈 My Reading Adventure 📚</h1><div id="dayLabel">Adventure Day 1</div></header><div class="wrap"><section id="today"><div class="card hero"><div style="font-size:50px">🦄⭐📖</div><h2>Today's Adventure</h2><div id="stars" class="stars">☆ ☆ ☆ ☆</div><div id="msg">Complete all four missions!</div></div><div id="missions"></div><div id="finish" class="card hide"><div class="next"><h2>🎉 You did it!</h2><button id="nextBtn" class="btn">Unlock Next Adventure 🌟</button></div></div></section><section id="journey" class="hide"><div class="card"><h2>🗺️ My Journey</h2><div class="prompt"><b id="doneDays">0</b> adventures finished<br><b id="earned">0</b> stars earned</div></div></section></div><nav><button id="todayBtn" class="btn">🌈 Today</button><button id="journeyBtn" class="btn">🗺️ Journey</button></nav><script>var completed=[false,false,false,false];var currentDay=1;try{currentDay=parseInt(localStorage.getItem('readingDay')||'1',10)||1}catch(e){}var words=['map','sat','tap','mat','nap','sit','pin','tip','sip','pat','cat','fan','fit','hot','hop','dog','run','rug'];var sentences=['Sam sat.','A cat sat.','Sam can tap.','A cat can nap.','The cat can run.','A dog can hop.'];function el(id){return document.getElementById(id)}function wordAt(n){return words[(currentDay*3+n)%words.length]}function build(){var w=wordAt(1),w2=wordAt(4),s=sentences[currentDay%sentences.length];el('dayLabel').textContent='Adventure Day '+currentDay;el('missions').innerHTML='<div class="card"><div class="mission pink"><h2>👂 1. Sound Detective</h2><div class="prompt">Say <b>'+w.toUpperCase()+'</b>. What sound comes first?</div><button id="m0" class="btn done">⭐ I Did It!</button></div><div class="mission blue"><h2>🔤 2. Read My Words</h2><div class="word">'+w+' &nbsp; '+w2+'</div><div class="prompt">Touch each sound, blend it, then read the word.</div><button id="m1" class="btn done">⭐ I Read Them!</button></div><div class="mission green"><h2>📚 3. Read & Think</h2><div class="prompt"><b>'+s+'</b><br><br>Who or what is this sentence about?</div><button id="m2" class="btn done">⭐ I Read It!</button></div><div class="mission orange"><h2>✏️ 4. Touch & Trace</h2><div class="prompt">Which letter makes the first sound in <b>'+w+'</b>?</div><div id="choices" class="choices"></div><p style="text-align:center;font-weight:800">Trace the big letter with your finger or Apple Pencil ✨</p><div class="trace"><canvas id="pad"></canvas></div><p><button id="clearBtn" class="btn">🧽 Clear</button> <button id="m3" class="btn done">⭐ I Practiced!</button></p></div></div>';completed=[false,false,false,false];el('stars').textContent='☆ ☆ ☆ ☆';el('finish').className='card hide';for(var i=0;i<4;i++){(function(j){el('m'+j).onclick=function(){mark(j)}})(i)}makeChoices(w.charAt(0));setupPad(w.charAt(0));el('clearBtn').onclick=function(){setupPad(w.charAt(0))};stats()}function mark(i){completed[i]=true;var x='';for(var j=0;j<4;j++)x+=completed[j]?'⭐ ':'☆ ';el('stars').textContent=x;if(completed[0]&&completed[1]&&completed[2]&&completed[3]){el('msg').textContent='All missions complete! 🌟';el('finish').className='card'}}function makeChoices(t){var all=['m','s','t','p','n','c','f','r','d','h'];var a=[t,all[(currentDay+2)%all.length],all[(currentDay+5)%all.length]];var box=el('choices');box.innerHTML='';for(var i=0;i<a.length;i++){var b=document.createElement('button');b.className='choice';b.textContent=a[i];(function(btn,val){btn.onclick=function(){var bs=box.getElementsByTagName('button');for(var k=0;k<bs.length;k++)bs[k].className='choice';btn.className='choice '+(val===t?'correct':'wrong');el('msg').textContent=val===t?'Yes! Great listening! ⭐':'Try again. Listen to the first sound. 💛'}})(b,a[i]);box.appendChild(b)}}function setupPad(letter){var c=el('pad');if(!c)return;var r=c.getBoundingClientRect();var ratio=window.devicePixelRatio||1;c.width=Math.max(300,r.width*ratio);c.height=250*ratio;var ctx=c.getContext('2d');ctx.setTransform(ratio,0,0,ratio,0,0);ctx.font='bold 190px Trebuchet MS';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='#d7cfea';ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.strokeText(letter.toUpperCase(),r.width/2,125);var drawing=false;function xy(e){var q=c.getBoundingClientRect(),p=(e.touches&&e.touches[0])?e.touches[0]:e;return[p.clientX-q.left,p.clientY-q.top]}function start(e){if(e.cancelable)e.preventDefault();drawing=true;var p=xy(e);ctx.beginPath();ctx.moveTo(p[0],p[1])}function move(e){if(!drawing)return;if(e.cancelable)e.preventDefault();var p=xy(e);ctx.setLineDash([]);ctx.strokeStyle='#7357b6';ctx.lineWidth=9;ctx.lineCap='round';ctx.lineTo(p[0],p[1]);ctx.stroke()}function stop(){drawing=false}c.ontouchstart=start;c.ontouchmove=move;c.ontouchend=stop;c.onmousedown=start;c.onmousemove=move;c.onmouseup=stop;c.onmouseleave=stop}function stats(){var n=0;try{n=parseInt(localStorage.getItem('readingDone')||'0',10)||0}catch(e){}el('doneDays').textContent=n;el('earned').textContent=n*4}el('nextBtn').onclick=function(){var n=0;try{n=parseInt(localStorage.getItem('readingDone')||'0',10)||0;localStorage.setItem('readingDone',String(n+1));localStorage.setItem('readingDay',String(++currentDay))}catch(e){currentDay++}build();window.scrollTo(0,0)};el('todayBtn').onclick=function(){el('today').className='';el('journey').className='hide'};el('journeyBtn').onclick=function(){el('today').className='hide';el('journey').className='';stats()};build();</script></body></html>
