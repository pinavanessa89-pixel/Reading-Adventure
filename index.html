<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Reading Adventure</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Trebuchet MS",sans-serif;background:linear-gradient(#eaf9ff,#fff6e8);color:#293241}header{text-align:center;padding:18px;background:#fff}h1{margin:0;color:#7054b5}.wrap{max-width:800px;margin:auto;padding:16px 16px 90px}.card{background:#fff;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 5px 15px #0001}.hero{text-align:center;background:linear-gradient(135deg,#eee8ff,#e5f8ff)}h2{color:#684aa9}.stars{font-size:32px}.mission{padding:16px;border-radius:20px;margin:12px 0}.pink{background:#ffe9f2}.blue{background:#e5f6ff}.green{background:#e8f8ef}.orange{background:#fff0df}.prompt{font-size:22px;text-align:center;background:#fff;border-radius:16px;padding:15px;margin:10px 0}.word{font-size:52px;font-weight:900;text-align:center;color:#3f5a90}.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:14px 18px;background:#7357b6;color:#fff;min-height:54px}.done{background:#4da77b}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{font-size:34px;background:#fff;color:#3f5a90;border:3px solid #cfe6f3;border-radius:16px;min-height:70px}.correct{background:#dff7e8}.wrong{background:#ffe4e4}.trace{background:#fff;border:3px dashed #c9b9ed;border-radius:18px;padding:8px}canvas{width:100%;height:250px;display:block;touch-action:none}.next{text-align:center;background:#fff6c7;padding:18px;border-radius:18px}.hide{display:none}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:9px;display:flex;justify-content:center;gap:8px}nav button{background:#eeeaf8;color:#5c5074}.conf{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}.conf span{position:absolute;top:-30px;font-size:25px;animation:f 1.6s linear forwards}@keyframes f{to{transform:translateY(110vh) rotate(400deg)}}</style></head><body><header><h1>🌈 My Reading Adventure 📚</h1><div id="dayLabel"></div></header><div id="conf" class="conf"></div><div class="wrap"><section id="today"><div class="card hero"><div style="font-size:50px">🦄⭐📖</div><h2>Today's Adventure</h2><div id="stars" class="stars">☆ ☆ ☆ ☆</div><div id="msg">Loading today's missions…</div></div><div id="missions"></div><div id="finish" class="card hide"><div class="next"><h2>🎉 You did it!</h2><button id="nextBtn" class="btn">Unlock Next Adventure 🌟</button></div></div></section><section id="journey" class="hide"><div class="card"><h2>🗺️ My Journey</h2><div class="prompt"><b id="doneDays">0</b> adventures finished<br><b id="earned">0</b> stars earned</div></div></section></div><nav><button id="todayBtn" class="btn">🌈 Today</button><button id="journeyBtn" class="btn">🗺️ Journey</button></nav><script>(function(){'use strict';const $=id=>document.getElementById(id);const levels=[{name:'Sound Explorer',words:['map','sat','tap','mat','nap','sit','pin','tip','sip','pat'],sent:['Sam sat.','A cat sat.','Sam can tap.','A cat can nap.'],sound:['Say MAP. What sound comes first?','Say SUN. What sound comes last?','Blend: /m/ /a/ /p/.','Stretch CAT into all its sounds.']},{name:'Word Builder',words:['cat','can','fan','fit','hot','hop','dog','dot','run','rug'],sent:['The cat can run.','A dog can hop.','The cat is hot.','I can run.'],sound:['Say FAN. Change /f/ to /c/.','What middle sound is in HOT?','Stretch DOG into each sound.','Blend: /r/ /u/ /n/.']},{name:'Sentence Star',words:['ship','shop','fish','chin','much','rush','then','this','with','thin'],sent:['The fish can swim.','This is a fish.','The ship is big.','I can rush.'],sound:['What sound starts SHIP?','Blend: /sh/ /o/ /p/.','What sound ends FISH?','Stretch CHIN into its sounds.']}];const qs=['Who is the character? Where is the setting?','How is the character feeling? What did the character do?','What is one fact you learned?','What happened first, next, and last?','Can you find the title?','What did a picture teach you?'];let d=parseInt(localStorage.getItem('day')||'1',10),complete=[false,false,false,false];function pick(a,s){return a[(d*7+s*3)%a.length]}function lev(){return Math.min(2,Math.floor((d-1)/5))}function render(){const L=levels[lev()],w=pick(L.words,1),w2=pick(L.words,3),sentence=pick(L.sent,2),sound=pick(L.sound,4),q=pick(qs,5);$('dayLabel').textContent='Adventure Day '+d+' • '+L.name;$('missions').innerHTML='<div class="card"><div class="mission pink"><h2>👂 1. Sound Detective</h2><div class="prompt">'+sound+'</div><button class="btn done" data-mark="0">⭐ I Did It!</button></div><div class="mission blue"><h2>🔤 2. Read My Words</h2><div class="word">'+w+' &nbsp; '+w2+'</div><div class="prompt">Touch each sound, blend it, then say the word.</div><button class="btn done" data-mark="1">⭐ I Read Them!</button></div><div class="mission green"><h2>📚 3. Read & Think</h2><div class="prompt"><b>'+sentence+'</b><br><br>'+q+'</div><button class="btn done" data-mark="2">⭐ I Read It!</button></div><div class="mission orange"><h2>✏️ 4. Touch & Trace</h2><div class="prompt">Which letter makes the first sound in <b>'+w+'</b>?</div><div id="choices" class="choices"></div><p style="text-align:center;font-weight:800">Trace the letter with your finger or Apple Pencil ✨</p><div class="trace"><canvas id="pad"></canvas></div><p><button id="clearBtn" class="btn">🧽 Clear</button> <button class="btn done" data-mark="3">⭐ I Practiced!</button></p></div></div>';complete=[false,false,false,false];$('stars').textContent='☆ ☆ ☆ ☆';$('finish').classList.add('hide');$('msg').textContent='Complete all four missions!';document.querySelectorAll('[data-mark]').forEach(b=>b.addEventListener('click',()=>mark(Number(b.dataset.mark))));setupChoices(w[0]);setTimeout(()=>setupPad(w[0]),50);$('clearBtn').addEventListener('click',()=>setupPad(w[0]));stats()}function setupChoices(t){const pool=['m','s','t','p','n','c','f','r','d'].filter(x=>x!==t),a=[t,pool[d%pool.length],pool[(d+3)%pool.length]].sort(()=>Math.random()-.5);$('choices').innerHTML='';a.forEach(x=>{const b=document.createElement('button');b.className='choice';b.textContent=x;b.addEventListener('click',()=>{document.querySelectorAll('.choice').forEach(z=>z.classList.remove('correct','wrong'));b.classList.add(x===t?'correct':'wrong');$('msg').textContent=x===t?'Yes! Great listening! ⭐':'Try again. Listen to the first sound. 💛'});$('choices').appendChild(b)})}function setupPad(letter){const c=$('pad');if(!c)return;const r=c.getBoundingClientRect(),ratio=window.devicePixelRatio||1;c.width=r.width*ratio;c.height=250*ratio;const ctx=c.getContext('2d');ctx.scale(ratio,ratio);ctx.font='bold 190px Trebuchet MS';ctx.textAlign='center';ctx.textBaseline='middle';ctx.strokeStyle='#d7cfea';ctx.lineWidth=3;ctx.setLineDash([8,8]);ctx.strokeText(letter.toUpperCase(),r.width/2,125);let drawing=false;const pos=e=>{const q=c.getBoundingClientRect();return[e.clientX-q.left,e.clientY-q.top]};c.onpointerdown=e=>{e.preventDefault();drawing=true;c.setPointerCapture(e.pointerId);const p=pos(e);ctx.beginPath();ctx.moveTo(p[0],p[1])};c.onpointermove=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.setLineDash([]);ctx.strokeStyle='#7357b6';ctx.lineWidth=9;ctx.lineCap='round';ctx.lineTo(p[0],p[1]);ctx.stroke()};c.onpointerup=()=>drawing=false;c.onpointercancel=()=>drawing=false}function mark(i){complete[i]=true;$('stars').textContent=complete.map(x=>x?'⭐':'☆').join(' ');if(complete.every(Boolean)){$('finish').classList.remove('hide');$('msg').textContent='All missions complete! 🌟';party()}}function nextDay(){localStorage.setItem('done',String(parseInt(localStorage.getItem('done')||'0',10)+1));d++;localStorage.setItem('day',String(d));render();window.scrollTo(0,0)}function stats(){const n=parseInt(localStorage.getItem('done')||'0',10);$('doneDays').textContent=n;$('earned').textContent=n*4}function show(id){$('today').classList.add('hide');$('journey').classList.add('hide');$(id).classList.remove('hide');stats()}function party(){for(let i=0;i<20;i++){const s=document.createElement('span');s.textContent=['⭐','🎉','🌈','📚'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.4+'s';$('conf').appendChild(s);setTimeout(()=>s.remove(),2100)}}$('nextBtn').addEventListener('click',nextDay);$('todayBtn').addEventListener('click',()=>show('today'));$('journeyBtn').addEventListener('click',()=>show('journey'));render();})();</script></body></html>
