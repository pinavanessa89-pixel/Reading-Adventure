<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Reading Adventure</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Trebuchet MS",sans-serif;background:linear-gradient(#eaf9ff,#fff6e8);color:#293241}header{text-align:center;padding:18px;background:#fff;border-bottom:2px solid #eee}h1{margin:0;color:#7054b5}.wrap{max-width:800px;margin:auto;padding:16px 16px 90px}.card{background:#fff;border-radius:24px;padding:20px;margin:14px 0;box-shadow:0 5px 15px #0001}.hero{text-align:center;background:linear-gradient(135deg,#eee8ff,#e5f8ff)}h2{color:#684aa9}.stars{font-size:32px}.mission{padding:16px;border-radius:20px;margin:12px 0}.pink{background:#ffe9f2}.blue{background:#e5f6ff}.green{background:#e8f8ef}.orange{background:#fff0df}.prompt{font-size:22px;text-align:center;background:#fff;border-radius:16px;padding:15px;margin:10px 0}.word{font-size:52px;font-weight:900;letter-spacing:5px;text-align:center;color:#3f5a90}button{font:inherit;font-weight:800;border:0;border-radius:16px;padding:14px 18px;background:#7357b6;color:#fff;min-height:54px}.done{background:#4da77b}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.choice{font-size:34px;background:#fff;color:#3f5a90;border:3px solid #cfe6f3}.correct{background:#dff7e8!important;border-color:#68b98a!important}.wrong{background:#ffe4e4!important;border-color:#e28b8b!important}.trace{background:#fff;border:3px dashed #c9b9ed;border-radius:18px;padding:8px}canvas{width:100%;height:250px;display:block;touch-action:none}.next{text-align:center;background:#fff6c7;padding:18px;border-radius:18px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:9px;display:flex;justify-content:center;gap:8px}nav button{min-height:45px;padding:10px;background:#eeeaf8;color:#5c5074}.hide{display:none}.conf{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}.conf span{position:absolute;top:-30px;font-size:25px;animation:f 1.6s linear forwards}@keyframes f{to{transform:translateY(110vh) rotate(400deg)}}
</style></head><body><header><h1>🌈 My Reading Adventure 📚</h1><div id="day"></div></header><div class="conf" id="conf"></div><div class="wrap"><section id="today"><div class="card hero"><div style="font-size:50px">🦄⭐📖</div><h2>Today's Adventure</h2><div class="stars" id="stars">☆ ☆ ☆ ☆</div><div id="msg">Complete all four missions!</div></div><div id="missions"></div><div class="card hide" id="finish"><div class="next"><h2>🎉 You did it!</h2><p>Your next reading adventure is ready.</p><button onclick="nextDay()">Unlock Next Adventure 🌟</button></div></div></section><section id="journey" class="hide"><div class="card"><h2>🗺️ My Journey</h2><div class="prompt"><b id="doneDays">0</b> adventures finished<br><b id="earned">0</b> stars earned</div><p>Every five adventures, the reading challenge grows a little.</p></div></section></div><nav><button onclick="show('today')">🌈 Today</button><button onclick="show('journey')">🗺️ Journey</button></nav><script>
const levels=[{name:'Sound Explorer',words:['map','sat','tap','mat','nap','sit','pin','tip','sip','pat'],sent:['Sam sat.','A cat sat.','Sam can tap.','A cat can nap.'],sound:['Say MAP. What sound comes first?','Say SUN. What sound comes last?','Blend: /m/ /a/ /p/.','Stretch CAT into all its sounds.']},{name:'Word Builder',words:['cat','can','fan','fit','hot','hop','dog','dot','run','rug'],sent:['The cat can run.','A dog can hop.','The cat is hot.','I can run.'],sound:['Say FAN. Change /f/ to /c/.','What middle sound is in HOT?','Stretch DOG into each sound.','Blend: /r/ /u/ /n/.']},{name:'Sentence Star',words:['ship','shop','fish','chin','much','rush','then','this','with','thin'],sent:['The fish can swim.','This is a fish.','The ship is big.','I can rush.'],sound:['What sound starts SHIP?','Blend: /sh/ /o/ /p/.','What sound ends FISH?','Stretch CHIN into its sounds.']}];
const qs=['Who is the character? Where is the setting?','How is the character feeling? What did the character do?','What is one fact you learned?','What happened first, next, and last?','Can you find the title?','What did a picture teach you?'];let d=+(localStorage.day||1),complete=[0,0,0,0];const pick=(a,s)=>a[(d*7+s*3)%a.length];function lev(){return Math.min(2,Math.floor((d-1)/5))}function render(){let L=levels[lev()],w=pick(L.words,1),w2=pick(L.words,3),sentence=pick(L.sent,2),sound=pick(L.sound,4),q=pick(qs,5);day.textContent='Adventure Day '+d+' • '+L.name;missions.innerHTML=`<div class="card"><div class="mission pink"><h2>👂 1. Sound Detective</h2><div class="prompt">${sound}</div><button class="done" onclick="mark(0)">⭐ I Did It!</button></div><div class="mission blue"><h2>🔤 2. Read My Words</h2><div class="word">${w} &nbsp; ${w2}</div><div class="prompt">Touch each sound, blend it, then say the word.</div><button class="done" onclick="mark(1)">⭐ I Read Them!</button></div><div class="mission green"><h2>📚 3. Read & Think</h2><div class="prompt"><b>${sentence}</b><br><br>${q}</div><button class="done" onclick="mark(2)">⭐ I Read It!</button></div><div class="mission orange"><h2>✏️ 4. Touch & Trace</h2><div class="prompt">Which letter makes the first sound in <b>${w}</b>?</div><div class="choices" id="choices"></div><p style="text-align:center;font-weight:800">Trace the letter with your finger or Apple Pencil ✨</p><div class="trace"><canvas id="pad"></canvas></div><p><button onclick="setupPad('${w[0]}')">🧽 Clear & Try Again</button> <button class="done" onclick="mark(3)">⭐ I Practiced!</button></p></div></div>`;complete=[0,0,0,0];stars.textContent='☆ ☆ ☆ ☆';finish.classList.add('hide');msg.textContent='Complete all four missions!';setupChoices(w[0]);setTimeout(()=>setupPad(w[0]),30);stats()}
function setupChoices(t){let pool=['m','s','t','p','n','c','f','r','d'].filter(x=>x!=t),a=[t,pool[d%pool.length],pool[(d+3)%pool.length]].sort(()=>Math.random()-.5);choices.innerHTML=a.map(x=>`<button class="choice" onclick="choose(this,'${x}','${t}')">${x}</button>`).join('')}function choose(b,x,t){document.querySelectorAll('.choice').forEach(z=>z.classList.remove('correct','wrong'));b.classList.add(x==t?'correct':'wrong');msg.textContent=x==t?'Yes! Great listening! ⭐':'Try again. Listen to the first sound. 💛'}
function setupPad(letter){let c=document.getElementById('pad');if(!c)return,r=c.getBoundingClientRect(),ratio=devicePixelRatio||1;c.width=r.width*ratio;c.height=250*ratio;let x=c.getContext('2d');x.scale(ratio,ratio);x.font='bold 190px Trebuchet MS';x.textAlign='center';x.textBaseline='middle';x.strokeStyle='#d7cfea';x.lineWidth=3;x.setLineDash([8,8]);x.strokeText(letter.toUpperCase(),r.width/2,125);let draw=false;function p(e){let q=c.getBoundingClientRect(),z=e.touches?e.touches[0]:e;return[z.clientX-q.left,z.clientY-q.top]}function st(e){e.preventDefault();draw=true;let z=p(e);x.beginPath();x.moveTo(...z)}function mv(e){if(!draw)return;e.preventDefault();let z=p(e);x.setLineDash([]);x.strokeStyle='#7357b6';x.lineWidth=9;x.lineCap='round';x.lineTo(...z);x.stroke()}function en(){draw=false}c.onpointerdown=st;c.onpointermove=mv;c.onpointerup=en;c.onpointerleave=en;c.ontouchstart=st;c.ontouchmove=mv;c.ontouchend=en}
function mark(i){complete[i]=1;stars.textContent=complete.map(x=>x?'⭐':'☆').join(' ');if(complete.every(Boolean)){finish.classList.remove('hide');msg.textContent='All missions complete! 🌟';party()}}function nextDay(){localStorage.done=+(localStorage.done||0)+1;localStorage.day=++d;render();scrollTo(0,0)}function stats(){let n=+(localStorage.done||0);doneDays.textContent=n;earned.textContent=n*4}function show(id){today.classList.add('hide');journey.classList.add('hide');document.getElementById(id).classList.remove('hide');stats()}function party(){for(let i=0;i<24;i++){let s=document.createElement('span');s.textContent=['⭐','🎉','🌈','📚'][i%4];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.4+'s';conf.appendChild(s);setTimeout(()=>s.remove(),2100)}}render();
</script></body></html>
